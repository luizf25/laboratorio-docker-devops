# Healthcheck (desafio avançado):
# a imagem mcr.microsoft.com/dotnet/aspnet:10.0 NÃO possui curl nem wget,
# mas possui bash. Usamos o recurso /dev/tcp do bash para enviar um
# GET /health e considerar saudável somente se a resposta for HTTP 200.
x-healthcheck: &healthcheck
  test:
    - CMD
    - bash
    - -c
    - 'exec 3<>/dev/tcp/127.0.0.1/8080 && printf "GET /health HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n" >&3 && head -n 1 <&3 | grep -q " 200 "'
  interval: 10s
  timeout: 5s
  retries: 3
  start_period: 5s

services:

  staging:
    image: devops-webapi:1.1.0
    container_name: devops-api-staging
    ports:
      - "8081:8080"
    environment:
      APP_ENVIRONMENT: staging
      APP_VERSION: "1.1.0"
    healthcheck: *healthcheck

  production:
    image: devops-webapi:1.1.0
    container_name: devops-api-prod
    ports:
      - "8082:8080"
    environment:
      APP_ENVIRONMENT: production
      APP_VERSION: "1.1.0"
    healthcheck: *healthcheck
